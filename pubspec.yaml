name: bolaria_entregas
description: Gestão de entregas da bolaria
publish_to: none
version: 4.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  app_links: ^6.3.2
  intl: any

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FDDFDE"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
